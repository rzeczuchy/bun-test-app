info:
  name: List-users
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/admin/users"
  auth:
    type: basic
    username: "{{adminUser}}"
    password: "{{adminPassword}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status code is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("body is JSON", function () {
          expect(res.getBody()).to.have.jsonBody();
        });

        test("content-type header is application/json", function () {
          expect(res.getHeader("content-type")).to.include("application/json");
        });

        test("created user is on the list", function () {
          const username = bru.interpolate("{{create-user-username}}");
          const users = res.getBody().users;

          expect(users).to.be.an("array");

          const found = users.find(
            (u) => u.username.toLowerCase() === username.toLowerCase()
          );

          expect(found, `user "${username}" not found in the list`).to.not.be.undefined;
          expect(found.role).to.equal("user");
          expect(Number.isInteger(found.id)).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
