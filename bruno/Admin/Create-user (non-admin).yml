info:
  name: Create-user (non-admin)
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/admin/user"
  body:
    type: json
    data: |-
      {
        "username": "someuser",
        "password": "somepassword"
      }
  auth:
    type: basic
    username: "{{create-user-username}}"
    password: "{{create-user-password}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status code is 403", function() {
          expect(res.getStatus()).to.equal(403);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
