info:
  name: Create-user (non-admin)
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/admin/user"
  body:
    type: json
    data: |-
      {
        "username": "{{testUser}}",
        "password": "{{testPassword}}"
      }
  auth:
    type: basic
    username: not-admin-user
    password: somepass123

runtime:
  scripts:
    - type: after-response
      code: |-
        test("status code is 401", function() {
          expect(res.getStatus()).to.equal(401);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
