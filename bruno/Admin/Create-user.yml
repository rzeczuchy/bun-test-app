info:
  name: Create-user
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/admin/user"
  body:
    type: json
    data: |-
      {
        "username": "qa_{{$timestamp}}",
        "password": "{{create-user-password}}"
      }
  auth:
    type: bearer
    token: "{{admin-access-token}}"

runtime:
  scripts:
    - type: before-request
      code: bru.setVar("create-user-password", "smacko-123");
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          bru.setVar("create-user-username", res.getBody().user.username);
        }
    - type: tests
      code: |-
        test("status code is 201", function() {
          expect(res.getStatus()).to.equal(201);
        });

        test("body is JSON", function () {
          expect(res.getBody()).to.have.jsonBody();
        });

        test("content-type header is application/json", function () {
          expect(res.getHeader("content-type")).to.include("application/json");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
