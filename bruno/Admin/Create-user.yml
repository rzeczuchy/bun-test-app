info:
  name: Create-user
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/admin/users"
  body:
    type: json
    data: |-
      {
        "username": "{{testUser}}",
        "password": "{{testPassword}}"
      }
  auth:
    type: basic
    username: "{{adminUser}}"
    password: "{{adminPassword}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
