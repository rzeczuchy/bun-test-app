info:
  name: Create-user
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/admin/user"
  body:
    type: json
    data: |-
      {
        "username": "{{testUser}}",
        "password": "{{testPassword}}"
      }
  auth:
    type: basic
    username: "{{adminUser}}"
    password: "{{adminPassword}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status code is 201", function() {
          expect(res.getStatus()).to.equal(201);
        });

        test("body is JSON", function () {
          expect(res.getBody()).to.have.jsonBody();
        });

        test("content-type header is application/json", function () {
          expect(res.getHeader("content-type")).to.include("application/json");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
